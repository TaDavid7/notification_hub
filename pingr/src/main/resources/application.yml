spring:
  application:
    name: pingr
  datasource:
    # The database keeps the name it had before the project became Pingr, so existing
    # local volumes and the RDS instance carry on as they are
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5442/notification_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  http:
    client:
      # Applies to the RestClient the sources poll with. The Discord and Slack senders
      # build their own clients and are unaffected.
      connect-timeout: 5s
      read-timeout: 20s
  task:
    scheduling:
      pool:
        # One thread each for the dispatcher, reaper, reminder job and poller. With
        # Spring's default of one they take turns, and a slow poll pass would hold up
        # message delivery.
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info

discord:
  webhookUrl: ${DISCORD_WEBHOOK_URL:}
  # Slash commands. All from the application's page in the Discord developer portal.
  applicationId: ${DISCORD_APPLICATION_ID:}
  publicKey: ${DISCORD_PUBLIC_KEY:}       # verifies requests to /discord/interactions
  botToken: ${DISCORD_BOT_TOKEN:}         # only used to register the commands
  guildId: ${DISCORD_GUILD_ID:}           # optional: register to one server, where changes show at once
  apiBaseUrl: https://discord.com/api/v10

slack:
  webhookUrl: ${SLACK_WEBHOOK_URL:}

notifications:
  # Background dispatcher that drains the outbox. Sends happen here, never on the
  # request thread, so a slow webhook can't hold a DB connection or a caller open.
  dispatch:
    delayMs: 5000              # gap between passes
    initialDelayMs: 10000      # let the app finish starting first
    batchSize: 25              # rows claimed per pass
    maxAttempts: 5             # then the row goes DEAD with last_error kept
    baseBackoffSeconds: 30     # doubles per attempt: 30s, 1m, 2m, 4m (jittered)
    maxBackoffSeconds: 3600
    stuckAfterSeconds: 300     # a SENDING row older than this is treated as orphaned
  reaper:
    delayMs: 60000
    initialDelayMs: 60000

alerts:
  # Each distinct subscription is its own poll against a rate-limited API
  maxFeedsPerUser: 10
  reminders:
    delayMs: 900000            # a pass every 15 minutes
    initialDelayMs: 60000
    startingSoonHours: 24      # remind this long before an event starts
    onSaleSoonMinutes: 60      # and this long before tickets go on sale

polling:
  delayMs: 60000             # look for due groups every minute
  initialDelayMs: 30000
  batchSize: 10              # groups polled per pass
  leaseSeconds: 600          # a claimed group is left alone this long; a crash mid-poll is retried after it
  baseBackoffSeconds: 300    # after a failed poll: about 5m, 10m, 20m... (jittered)
  maxBackoffSeconds: 21600   # capped at 6h
  defaultIntervalMinutes: 60
  intervalMinutes:           # how often each distinct query is polled, per source
    TICKETMASTER: 60
    CHEAPSHARK: 60
  rateLimits:                # per API host; 0 means no limit of that kind
    # Bracketed, or Spring reads the dots in the host as nesting and the limit never applies
    "[app.ticketmaster.com]":
      perSecond: 4           # Ticketmaster allows 5
      perDay: 4500           # of 5000, leaving headroom
    "[www.cheapshark.com]":
      perSecond: 1           # no published limit; stay gentle
      perDay: 0

ticketmaster:
  apiKey: ${TICKETMASTER_API_KEY:}
  baseUrl: https://app.ticketmaster.com/discovery/v2
  pageSize: 200              # the API's largest page
  maxPages: 5                # 5 x 200 = 1000, as deep as the API pages

cheapshark:
  baseUrl: https://www.cheapshark.com/api/1.0
