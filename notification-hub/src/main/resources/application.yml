spring:
  application:
    name: notification-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5442/notification_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

discord:
  webhookUrl: ${DISCORD_WEBHOOK_URL:}

slack:
  webhookUrl: ${SLACK_WEBHOOK_URL:}

canvas:
  baseUrl: ${CANVAS_BASE_URL:}
  token: ${CANVAS_TOKEN:}
  # Comma-separated course ids, e.g. "12345,67890". Must be a scalar, not a
  # YAML list: Spring flattens lists to canvas.courseIds[0] and @Value cannot
  # resolve that key.
  courseIds: ${CANVAS_COURSE_IDS:}
  pollDelayMs: 86400000      # once a day
  initialDelayMs: 5000              # 5 seconds on startup
