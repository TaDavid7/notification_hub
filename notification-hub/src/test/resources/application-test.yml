spring:
  # datasource url/username/password come from AbstractPostgresTest's container
  jpa:
    hibernate:
      ddl-auto: validate    # same as prod: Flyway owns the schema, not Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: warn

# Park the background dispatcher far enough out that it never fires during a test
# run. Tests that care about dispatch behaviour call the methods directly, so a
# timer racing them would only make results non-deterministic.
notifications:
  dispatch:
    initialDelayMs: 86400000
    delayMs: 86400000
  reaper:
    initialDelayMs: 86400000
    delayMs: 86400000
