spring:
  # datasource url/username/password come from AbstractPostgresTest's container
  jpa:
    hibernate:
      ddl-auto: validate    # same as prod: Flyway owns the schema, not Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: warn

# Leave Canvas unset so the poller stays disabled and tests make no outbound calls
canvas:
  baseUrl: ""
  token: ""
  courseIds: ""
