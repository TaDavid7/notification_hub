name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests-and-coverage:
    name: Tests & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Gradle wrapper exists
        run: |
          test -f notification-hub/gradlew || (echo "Missing Gradle wrapper in notification-hub/. Run 'gradle wrapper' locally and commit it." && exit 1)

      - name: Make gradlew executable
        run: chmod +x notification-hub/gradlew

      - name: Tests + coverage gate
        working-directory: notification-hub
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            notification-hub/build/reports/tests/test/**
            notification-hub/build/reports/jacoco/test/html/**

  push-image:
    name: Build & Push to ECR
    needs: tests-and-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # id-token lets the runner request an OIDC token to assume the AWS role.
    # No long-lived access keys are stored anywhere.
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: notification-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::906048429586:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        working-directory: notification-hub
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          # :latest is what App Runner watches; the SHA tag is there so a bad
          # deploy can be rolled back to a specific commit.
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"

      - name: Summary
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "Pushed \`$REGISTRY/$ECR_REPOSITORY:latest\` (also tagged \`${GITHUB_SHA::7}\`)." >> $GITHUB_STEP_SUMMARY
          echo "App Runner redeploys automatically **if the service is running** - it is paused by default." >> $GITHUB_STEP_SUMMARY
